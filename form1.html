<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset=" UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>
        Form
    </title>
</head>

<body>
    <div>
        <form>
            <div>
                <label for="id1">Name</label>
                <span style="color: red;">*</span>
                <span>:</span>
                <input type="text" id="id1" required>
            </div>
            <div>
                <label for="id2">Email</label>
                <span style="color: red;">*</span>
                <span>:</span>
                <input type="text" id="id2" required>
            </div>
            <div>
                <label for="id3">Phone</label>
                <span style="color: red;">*</span>
                <span>:</span>
                <input type="number" id="id3" required>
            </div>
            <div>
                <label for="id4">password</label>
                <span style="color: red;">*</span>
                <span>:</span>
                <input type="password" id="id4" required>
            </div>
            <div>
                <label for="id5">confirmPassword</label>
                <span style="color: red;">*</span>
                <span>:</span>
                <input type="password" id="id5" required>
            </div>
            <div>
                <label>Interested courses</label><br>
                <span>Java</span>
                <input type="checkbox">
                <span>Python</span>
                <input type="checkbox">
                <span>ML</span>
                <input type="checkbox">
                <span>Database</span>
                <input type="checkbox">
            </div>
        </form>
    </div>
</body>
